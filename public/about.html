<!doctype html>
<html lang="">
  <head>
    <meta charset="utf-8" />
    <title>About</title>
    <style>
      body,
      html {
        height: 100%;
        margin: 0;
        font-family: "Courier New", Courier, monospace;
        color: white;
      }
      .bgimg {
        background-image: url("./images/bg/page-bg.webp");
        height: 100%;
        background-position: center;
        background-size: cover;
        position: relative;
      }
      .middle {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
      }
      hr {
        margin: auto;
        width: 40%;
      }
    </style>
  </head>
  <body>
    <div class="bgimg">
      <div class="middle">
        <h1>COMING SOON</h1>
        <hr />
        <p>We are currently working on our website.</p>
        <p id="demo"></p>
        <p><a href="https://www.neighborhoodnerd21.com/">Return Home</a></p>
      </div>
    </div>
    <script>
      var countDownDate = new Date("December 5, 2026 15:37:25").getTime();
      var x = setInterval(function () {
        var now = new Date().getTime();
        var distance = countDownDate - now;
        var days = Math.floor(distance / (1000 * 60 * 60 * 24));
        var hours = Math.floor(
          (distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)
        );
        var minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
        var seconds = Math.floor((distance % (1000 * 60)) / 1000);
        document.getElementById("demo").innerHTML =
          days + "d " + hours + "h " + minutes + "m " + seconds + "s ";
        if (distance < 0) {
          clearInterval(x);
          document.getElementById("demo").innerHTML = "EXPIRED";
        }
      }, 1000);
    </script>
  </body>
</html>
