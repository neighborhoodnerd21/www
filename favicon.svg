<svg xmlns="http://w3.org" viewBox="0 0 100 100" width="100" height="100">
  <!-- Black rounded square background -->
  <rect width="100" height="100" rx="20" fill="#141413" />

  <!-- Open-roof house structure (White) -->
  <g fill="none" stroke="#ffffff" stroke-width="6.5" stroke-linecap="butt" stroke-linejoin="miter">
    <!-- Left roof slope with overhang -->
    <polyline points="16,52 45,27" />
    <!-- Right roof slope with overhang -->
    <polyline points="55,27 84,52" />
    <!-- House walls and base -->
    <polyline points="25,44 25,80 75,80 75,44" />
  </g>

  <!-- Terminal cursor ">_" (Mint Green) -->
  <g fill="none" stroke="#18c98e" stroke-width="5.5" stroke-linecap="butt" stroke-linejoin="miter">
    <!-- Chevron ">" -->
    <polyline points="38,51 46,59 38,67" />
    <!-- Underscore "_" -->
    <line x1="50" y1="67" x2="63" y2="67" />
  </g>
</svg>
