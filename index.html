<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NN21 Coming Soon</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      text-align: center;
      padding: 20px;
    }
    .container {
      max-width: 500px;
    }
    h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
      color: #38bdf8;
    }
    p {
      font-size: 1.1rem;
      color: #94a3b8;
      margin-bottom: 25px;
    }
    form {
      display: flex;
      gap: 10px;
      justify-content: center;
    }
    input[type="email"] {
      padding: 12px 15px;
      border-radius: 6px;
      border: 1px solid #334155;
      background-color: #1e293b;
      color: #fff;
      outline: none;
      width: 60%;
    }
    button {
      padding: 12px 20px;
      border-radius: 6px;
      border: none;
      background-color: #38bdf8;
      color: #0f172a;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background-color: #7dd3fc;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Coming Soon to a Neighborhood Near You!</h1>
    <p>We are working hard to launch our new website, sort of. Stay tuned!</p>
    <p>Ai Built my website<p>
  </div>
</body>
</html>
